version: "3.8"

services:
  php:
    build:
      context: ./docker/php
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    volumes:
      - ./:/app
      # Share the host's Claude Code auth/config so briefings can use the CLI
      # without an API key. Read-write because Claude Code writes session state.
      - ${HOME}/.claude:/home/app/.claude
    working_dir: /app

  nginx:
    image: nginx:alpine
    ports:
      - "8282:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
