version: "3.8"

services:
  php:
    build:
      context: ./docker/php
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    volumes:
      - ./:/app
    working_dir: /app

  nginx:
    image: nginx:alpine
    ports:
      - "8282:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
